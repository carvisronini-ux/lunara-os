<!-- services/templates/horoscope-template.svg -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ზედა ნაწილი: ზოდიაქოს სიმბოლო -->
  <text x="512" y="180" font-family="'Playfair Display', 'Georgia', serif" font-size="160" fill="#D4AF37" text-anchor="middle">{{ZODIAC_SYMBOL}}</text>
  
  <!-- ზოდიაქოს სახელი -->
  <text x="512" y="280" font-family="'Playfair Display', 'Georgia', serif" font-size="64" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="6">{{ZODIAC_NAME}}</text>
  
  <!-- თარიღი -->
  <text x="512" y="330" font-family="'Inter', 'Arial', sans-serif" font-size="24" fill="#A0A0A0" text-anchor="middle" letter-spacing="2">{{ZODIAC_DATE}}</text>

  <!-- დეკორატიული ხაზი -->
  <line x1="362" y1="380" x2="662" y2="380" stroke="#D4AF37" stroke-width="2" opacity="0.8"/>

  <!-- ჰოროსკოპის ტექსტი (აქ ჩაჯდება დინამიური ტექსტი) -->
  <foreignObject x="112" y="420" width="800" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Inter', 'Arial', sans-serif; font-size: 28px; line-height: 1.6; color: #FFFFFF; text-align: center; font-weight: 300;">
      {{HOROSCOPE_TEXT}}
    </div>
  </foreignObject>

  <!-- ქვედა დეკორატიული ხაზი -->
  <line x1="362" y1="880" x2="662" y2="880" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  
  <!-- ბრენდინგი -->
  <text x="512" y="940" font-family="'Playfair Display', 'Georgia', serif" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">LUNARA</text>
  <text x="512" y="980" font-family="'Inter', 'Arial', sans-serif" font-size="18" fill="#A0A0A0" text-anchor="middle" letter-spacing="2">@lunaraosapp</text>
</svg>